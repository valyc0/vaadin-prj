spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 50GB
      max-request-size: 50GB
      file-size-threshold: 0
  codec:
    max-in-memory-size: 10MB
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: vaadin-client
            client-secret: secret123
            provider: keycloak
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: http://localhost:8081/realms/demo-realm

# Keycloak configuration
keycloak:
  base-url: http://localhost:8081
  realm: demo-realm

# External services configuration
roles:
  service-url: http://localhost:8091/api/roles

server:
  port: 8080
  tomcat:
    connection-timeout: 7200000
    max-http-form-post-size: -1
    threads:
      max: 200
      min-spare: 10
  max-http-header-size: 102400

# Logging configuration with correlation ID
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.example.vaadin: DEBUG
    org.springframework.web: DEBUG

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/demo-realm
          jwk-set-uri: http://localhost:8081/realms/demo-realm/protocol/openid-connect/certs
  
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # File Upload Configuration - Support for large files (30GB+)
  servlet:
    multipart:
      enabled: true
      max-file-size: 50GB
      max-request-size: 50GB
      file-size-threshold: 0  # Write directly to stream, no temp file

server:
  port: 8091
  tomcat:
    connection-timeout: 3600000  # 1 hour timeout for large files
    max-http-form-post-size: -1  # No limit

keycloak:
  base-url: http://localhost:8081
  realm: demo-realm

# MinIO Configuration for streaming file uploads
minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket-name: roles-service-files

logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
    org.hibernate.SQL: DEBUG
